[include mainsail.cfg]
[include macro.cfg]
[include PnP_Demo.cfg]
[respond]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_1FA0001685182EAF5E1F565BC62000F5-if00

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 1000
max_z_velocity: 50
max_z_accel: 500

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

########################################
# TRỤC X - VẬT LÝ THẬT (Cắm khe X)
########################################
[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.29 
position_endstop: 0
position_min: 0
position_max: 430
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: P1.10
interpolate: False
run_current: 1.2
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC Y - VẬT LÝ THẬT (Cắm khe Y)
########################################
[stepper_y]
step_pin: P0.19
dir_pin: P0.20       
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.28
position_endstop: 0
position_min: 0
position_max: 285
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: P1.9
interpolate: False
run_current: 0.8
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC Y1 - MOTOR PHỤ (Cắm khe E0)
########################################
[stepper_y1]
step_pin: P2.13
dir_pin: !P0.11             # Thêm/bỏ dấu ! tùy thuộc chiều quay thực tế
enable_pin: !P2.12
microsteps: 16
rotation_distance: 40       # Phải bằng y hệt stepper_y

[tmc2209 stepper_y1]
uart_pin: P1.4
interpolate: False
run_current: 0.8
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC Z - VẬT LÝ THẬT (Cắm khe Z)
########################################
[stepper_z]
step_pin: P0.22
dir_pin: !P2.11              # Thêm/bỏ dấu ! để chỉnh chiều lên xuống
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8        # Chỉnh lại theo bước ren của vít me Z
endstop_pin: !P1.27
position_endstop: 12.5      # Thường PnP sẽ home Z ở trên cùng (max). Nếu home ở dưới, để 0
position_min: 3.2
position_max: 13
homing_speed: 5

[tmc2209 stepper_z]
uart_pin: P1.8              # Chân UART chuẩn của khe Z trên LPC1768/SKR 1.4
interpolate: False
run_current: 0.8
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC C (EXTRUDER) - XOAY ĐẦU HÚT (Cắm khe E1)
########################################
[extruder]
step_pin: P1.15
dir_pin: !P1.14
enable_pin: !P1.16
microsteps: 16
rotation_distance: 360

# --- CÁC THÔNG SỐ ĐÁNH LỪA KLIPPER ---
nozzle_diameter: 0.4         
filament_diameter: 1.75      
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F 
sensor_pin: P0.24
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114.0

min_temp: -273               
max_temp: 999
min_extrude_temp: -273       
max_extrude_only_distance: 999999 
max_extrude_only_velocity: 1000
max_extrude_only_accel: 3000

# --- TẮT THERMAL RUNAWAY VÌ KHÔNG CÓ HEATER/SENSOR THẬT ---
[verify_heater extruder]
max_error: 9999
check_gain_time: 9999
hysteresis: 9999
heating_gain: 0.001

[tmc2209 extruder]
uart_pin: P1.1
interpolate: False
run_current: 0.45
hold_current: 0.200
sense_resistor: 0.110
stealthchop_threshold: 0

[output_pin led_top]
pin: P2.7
pwm: True            # Kích hoạt PWM để cấp dòng ổn định hoặc chỉnh độ sáng
value: 0.2            # 1.0 = Sáng 100% khi bật nguồn (đổi thành 0.0 nếu muốn mặc định tắt)
cycle_time: 0.010    # Tần số 100Hz giúp LED không bị chớp nháy (flicker)
shutdown_value: 0.0  # Tự động tắt khi mạch báo lỗi

[output_pin led_down]
pin: P2.4
pwm: True            # Kích hoạt PWM để cấp dòng ổn định hoặc chỉnh độ sáng
value: 0.2             # 1.0 = Sáng 100% khi bật nguồn (đổi thành 0.0 nếu muốn mặc định tắt)
cycle_time: 0.010    # Tần số 100Hz giúp LED không bị chớp nháy (flicker)
shutdown_value: 0.0  # Tự động tắt khi mạch báo lỗi
