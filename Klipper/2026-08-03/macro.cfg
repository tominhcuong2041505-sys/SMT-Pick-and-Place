[gcode_macro TEST_XY_FULL_PRO]
description: Test toan dien XY: Chu nhat, Cheo, 2x CW/CCW Circles
gcode:
    # 1. Truy xuat cau hinh
    {% set f_test = printer.configfile.settings.printer.max_velocity * 60 %}
    {% set x_max = printer.configfile.settings.stepper_x.position_max %}
    {% set y_max = printer.configfile.settings.stepper_y.position_max %}
    
    # Tinh toan tam va ban kinh test
    {% set x_mid = x_max / 2 %}
    {% set y_mid = y_max / 2 %}
    {% set r_test = 110 %} 
    {% set f_home = 9000 %}

    # 2. Khoi tao may
    G90 
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28 
    {% endif %}

    M118 Bat dau Test XY | F:{f_test} | Vung test: {x_max}x{y_max}
    G1 X0 Y0 F{f_home}
    G4 P500 

    # --- PHAN 1: HINH CHU NHAT & DUONG CHEO ---
    M117 Stress Testing Rectangle...
    G1 X{x_max} Y0 F{f_test}
    G1 X{x_max} Y{y_max} F{f_test}
    G1 X0 Y{y_max} F{f_test}
    G1 X0 Y0 F{f_test}
    G1 X{x_max} Y{y_max} F{f_test} # Duong cheo 1
    G1 X0 Y0 F{f_test}

    # --- PHAN 2: XOAY VONG TRON 2 LAN (CW & CCW) ---
    M117 Circle Test (2x CW, 2x CCW)...
    G1 X{x_mid + r_test} Y{y_mid} F{f_test} 
    
    # 2 Vong thuan (CW)
    {% for i in range(2) %}
        G2 X{x_mid + r_test} Y{y_mid} I-{r_test} J0 F{f_test}
    {% endfor %}

    G4 P200 # Nghi dao chieu

    # 2 Vong nguoc (CCW)
    {% for i in range(2) %}
        G3 X{x_mid + r_test} Y{y_mid} I-{r_test} J0 F{f_test}
    {% endfor %}

    # --- PHAN 3: KET THUC ---
    M117 Returning Home...
    G1 X0 Y0 F{f_home}
    M400
    M118 Test XY hoan tat!


[gcode_macro TEST_XY_POTATO]
description: Test XY sieu don gian - phien ban Potato
gcode:
    # 1. Khởi tạo và ép Home nếu chưa home
    G90 
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28 
    {% endif %}

    M118 Chay Test Potato (Toc do 6000mm/min)...

    # 2. Chạy stress test theo hình vuông cơ bản (Điểm tọa độ bạn tự sửa cho hợp máy)
    # Giả định vùng test cơ bản là 200x200. Bạn có thể sửa số 200 thành kích thước máy của bạn.
    
    G1 X0 Y0 F6000          # Về góc 0
    G4 P200                 # Nghỉ 0.2 giây

    G1 X200 Y0 F6000        # Chạy hết trục X
    G1 X200 Y200 F6000      # Chạy hết trục Y
    G1 X0 Y200 F6000        # Trả X về 0
    G1 X0 Y0 F6000          # Trả Y về 0 (Xong 1 vòng hình vuông)

    G4 P500                 # Nghỉ nửa giây

    # 3. Kết thúc test, lùi về góc an toàn
    M400                    # Chờ motor chạy xong hết toàn bộ lệnh
    M118 Test Potato hoan tat!
    
[gcode_macro LED_TOP_ON]
gcode:
    SET_PIN PIN=led_top VALUE=0.5

[gcode_macro LED_TOP_OFF]
gcode:
    SET_PIN PIN=led_top VALUE=0

[gcode_macro LED_DOWN_ON]
gcode:
    SET_PIN PIN=led_down VALUE=0.5

[gcode_macro LED_DOWN_OFF]
gcode:
    SET_PIN PIN=led_down VALUE=0

[gcode_macro PNP_CONNECTED]
description: OpenPnP status
gcode:
    SET_PIN PIN=led_top VALUE=0.2
    SET_PIN PIN=led_down VALUE=0.2
    RESPOND TYPE=command MSG="OpenPnP Connected"
    RESPOND MSG="ok"

[gcode_macro M42]
description: Cầu nối lệnh M42 từ OpenPnP để điều khiển Actuator (ON/OFF)
gcode:
    {% set pin_num = params.P|default(-1)|int %}
    {% set pin_val = params.S|default(0)|float %}

    # P0: Điều khiển LED DOWN / VAN HÚT (Pin 2.4)
    {% if pin_num == 0 %}
        {% if pin_val > 0.0 %}
            SET_PIN PIN=led_down VALUE=0.2
        {% else %}
            SET_PIN PIN=led_down VALUE=0.0
        {% endif %}
    
    # P1: Điều khiển LED TOP (Pin 2.7)
    {% elif pin_num == 1 %}
        {% if pin_val > 0.0 %}
            SET_PIN PIN=led_top VALUE=0.2
        {% else %}
            SET_PIN PIN=led_top VALUE=0.0
        {% endif %}
    {% endif %}
    
    RESPOND MSG="ok"

[homing_override]
axes: xyz
gcode:
  G28 Z0
  G28 X0 Y0 E0
  G1 X10 Y10 Z6.65 E0 F1000