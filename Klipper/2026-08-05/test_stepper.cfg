[gcode_arcs]
resolution: 0.5 # Giảm tải cho MCU khi chạy tốc độ cao

[gcode_macro TEST_Y_STRESS]
description: Stress test truc Y tai toc do toi da
gcode:
    # 1. Lay thong so tu config
    {% set f_test = printer.configfile.settings.printer.max_velocity * 60 %}
    {% set y_max = printer.configfile.settings.stepper_y.position_max %}
    {% set f_home = 9000 %}
    {% set loops = 3 %}

    # 2. Khoi tao
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    M118 Bat dau Stress Test Y: {f_test} F | Hanh trinh: {y_max}mm
    G1 Y0 F{f_home}
    G4 P500 

    # 3. Vong lap chay stress
    {% for i in range(loops) %}
        M117 Loop {i+1}/{loops}
        G1 Y{y_max} F{f_test}
        G1 Y0 F{f_test}
    {% endfor %}

    # 4. Ket thuc
    M400 
    G28 Y
    M118 Test Y hoan tat!


