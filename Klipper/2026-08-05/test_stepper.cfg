[gcode_macro TEST_XY_FULL_PRO]
description: Test toan dien XY: Chu nhat, Cheo, 2x CW/CCW Circles
gcode:
    # 1. Truy xuat cau hinh
    {% set f_test = printer.configfile.settings.printer.max_velocity * 60 %}
    {% set x_max = printer.configfile.settings.stepper_x.position_max %}
    {% set y_max = printer.configfile.settings.stepper_y.position_max %}
    
    # Tinh toan tam va ban kinh test
    {% set x_mid = x_max / 2 %}
    {% set y_mid = y_max / 2 %}
    {% set r_test = 110 %} 
    {% set f_home = 9000 %}

    # 2. Khoi tao may
    G90 
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28 
    {% endif %}

    M118 Bat dau Test XY | F:{f_test} | Vung test: {x_max}x{y_max}
    G1 X0 Y0 F{f_home}
    G4 P500 

    # --- PHAN 1: HINH CHU NHAT & DUONG CHEO ---
    M117 Stress Testing Rectangle...
    G1 X{x_max} Y0 F{f_test}
    G1 X{x_max} Y{y_max} F{f_test}
    G1 X0 Y{y_max} F{f_test}
    G1 X0 Y0 F{f_test}
    G1 X{x_max} Y{y_max} F{f_test} # Duong cheo 1
    G1 X0 Y0 F{f_test}

    # --- PHAN 2: XOAY VONG TRON 2 LAN (CW & CCW) ---
    M117 Circle Test (2x CW, 2x CCW)...
    G1 X{x_mid + r_test} Y{y_mid} F{f_test} 
    
    # 2 Vong thuan (CW)
    {% for i in range(2) %}
        G2 X{x_mid + r_test} Y{y_mid} I-{r_test} J0 F{f_test}
    {% endfor %}

    G4 P200 # Nghi dao chieu

    # 2 Vong nguoc (CCW)
    {% for i in range(2) %}
        G3 X{x_mid + r_test} Y{y_mid} I-{r_test} J0 F{f_test}
    {% endfor %}

    # --- PHAN 3: KET THUC ---
    M117 Returning Home...
    G1 X0 Y0 F{f_home}
    M400
    M118 Test XY hoan tat!