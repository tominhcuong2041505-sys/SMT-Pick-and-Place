[gcode_macro PNP_CONNECTED]
description: OpenPnP status
gcode:
    SET_PIN PIN=led_top VALUE=0.01
    SET_PIN PIN=led_down VALUE=0.01
    RESPOND MSG="OpenPnP Connected"

[gcode_macro LED_TOP_ON]
gcode:
    SET_PIN PIN=led_top VALUE=0.5

[gcode_macro LED_TOP_OFF]
gcode:
    SET_PIN PIN=led_top VALUE=0

[gcode_macro LED_DOWN_ON]
gcode:
    SET_PIN PIN=led_down VALUE=0.5

[gcode_macro LED_DOWN_OFF]
gcode:
    SET_PIN PIN=led_down VALUE=0

[gcode_macro M42]
description: Cầu nối lệnh M42 từ OpenPnP để điều khiển Actuator (ON/OFF)
gcode:
    {% set pin_num = params.P|default(-1)|int %}
    {% set pin_val = params.S|default(0)|float %}

    # P0: Điều khiển LED DOWN / VAN HÚT (Pin 2.4)
    {% if pin_num == 1 %}
        {% if pin_val > 0.0 %}
            SET_PIN PIN=led_down VALUE=0.01
        {% else %}
            SET_PIN PIN=led_down VALUE=0.0
        {% endif %}
    
    # P1: Điều khiển LED TOP (Pin 2.7)
    {% elif pin_num == 2 %}
        {% if pin_val > 0.0 %}
            SET_PIN PIN=led_top VALUE=0.01
        {% else %}
            SET_PIN PIN=led_top VALUE=0.0
        {% endif %}
    {% endif %}
    
    RESPOND MSG="ok"

[gcode_macro G1]
rename_existing: G1.1
gcode:
    # Bắt giá trị trục C và Feedrate từ OpenPnP
    {% set c_axis = params.C|default(none) %}
    {% set feedrate = params.F|default(3000)|float / 60 %} 
    
    # Kích hoạt động cơ C chạy độc lập nếu có lệnh xoay
    {% if c_axis is not none %}
        MANUAL_STEPPER STEPPER=c MOVE={c_axis} SPEED={feedrate} SYNC=0
    {% endif %}
    
    # Lọc bỏ chữ C, giữ lại các tọa độ tịnh tiến X, Y, Z
    {% set clean_params = [] %}
    {% for k in params %}
        {% if k != 'C' %}
            {% set _ = clean_params.append(k ~ params[k]) %}
        {% endif %}
    {% endfor %}
    
    # Thực thi các trục tịnh tiến
    {% if clean_params|length > 0 %}
        G1.1 {clean_params|join(" ")}
    {% endif %}

[gcode_macro G0]
rename_existing: G0.1
gcode:
    # Tái sử dụng logic lọc lệnh cho G0
    G1 {rawparams}

[homing_override]
axes: xyz
gcode:
  G28 Z0
  G28 X0 Y0 E0
  G1 X10 Y10 Z-4 E0 F1000