######################################################################
# MACRO LÕI: CHU TRÌNH PnP TRUYỀN THAM SỐ TỐC ĐỘ CAO
######################################################################
[gcode_macro _PNP_CYCLE_CORE]
description: Macro noi bo xu ly 1 chu trinh PnP voi Z=F6000 va E=F9000
gcode:
    # Lấy các tham số tọa độ truyền vào (nếu thiếu sẽ tự lấy giá trị mặc định)
    {% set pick_x = params.PICK_X|default(20)|float %}
    {% set pick_y = params.PICK_Y|default(20)|float %}
    {% set place_x = params.PLACE_X|default(250)|float %}
    {% set place_y = params.PLACE_Y|default(150)|float %}
    {% set angle = params.ANGLE|default(45)|float %}

    # Tọa độ cố định của Bottom Camera
    {% set cam_x = 100 %}
    {% set cam_y = 50 %}

    # Đảm bảo hệ tọa độ tuyệt đối cho X,Y,Z và tương đối cho E (Trục C)
    G90 
    M83 

    # ---------------------------------------------------------
    # 1. MOVE TO FEEDER & PICK (Di chuyển tới Feeder & Gắp)
    # ---------------------------------------------------------
    M118 -> Chay den Feeder tai: X{pick_x}, Y{pick_y}
    G1 Z12 F6000                    ; Nâng Z an toàn với tốc độ F6000
    G1 X{pick_x} Y{pick_y} F12000    ; Phi tốc độ cao XY tới khay linh kiện
    
    M118 Ha Z gap linh kien (Z=2)
    G1 Z4 F6000                     ; Thụt Z xuống ăn hàng cực nhanh F6000
    M118 >>> [ON] VACUUM (BOM HUT)
    G4 P300                         ; Trễ 0.3s chờ lực hút áp suất âm ổn định
    
    G1 Z12 F6000                    ; Giật Z lên mức an toàn F6000

    # ---------------------------------------------------------
    # 2. VISION ALIGNMENT AT Z6 (Quét Camera tại độ cao Z=6)
    # ---------------------------------------------------------
    M118 -> Chay toi Bottom Camera: X{cam_x}, Y{cam_y}
    G1 X{cam_x} Y{cam_y} F12000 
    
    M118 Ha Z xuong Z6 de Camera lay tieu cu...
    G1 Z6 F6000                     ; Hạ xuống đúng Z=6 tốc độ F6000
    G4 P200                         ; Dừng 0.2s chốt frame hình OpenCV
    
    M118 Xoay truc C (Extruder) goc {angle} do...
    G1 E{angle} F9000               ; Trục C xoay định hướng siêu tốc F9000
    
    G1 Z12 F6000                    ; Rút Z lên an toàn F6000 để chuẩn bị đi cắm

    # ---------------------------------------------------------
    # 3. MOVE TO PCB & PLACE (Chạy tới bo mạch & Đặt)
    # ---------------------------------------------------------
    M118 -> Chay den vi tri PCB tai: X{place_x}, Y{place_y}
    G1 X{place_x} Y{place_y} F12000 
    
    M118 Ha Z de dat linh kien (Z=3)
    G1 Z4 F6000                     ; Lao Z xuống mặt PCB tốc độ F6000
    M118 >>> [OFF] NGAT VACUUM & BLOW-OFF (XA KHI)
    G4 P300                         ; Trễ 0.3s để thổi nhả linh kiện vào kem hàn
    
    G1 Z12 F6000                    ; Nhấc Z lên thoát khỏi vị trí vừa đặt F6000

    # ---------------------------------------------------------
    # 4. RESET C-AXIS (Trả ngược trục C về 0 tránh xoắn dây hơi)
    # ---------------------------------------------------------
    {% set reverse_angle = angle * -1 %}
    G1 E{reverse_angle} F9000       ; Trả cụm hút xoay về vị trí gốc F9000
    G92 E0                          ; Reset bộ đếm bước trục C về 0


######################################################################
# MACRO CHẠY TỰ ĐỘNG TỐC ĐỘ CAO: 3 LINH KIỆN KHÁC NHAU
######################################################################
[gcode_macro DEMO_PNP]
description: Chay chu trinh PnP mo phong voi 3 toa do gham khac nhau (Z F6000 / E F9000)
gcode:
    M118 ======== BAT DAU CHẠY TỐC ĐỘ CAO (HIGH-SPEED) ========
    
    # Ép buộc Homing hệ thống nếu chưa home để bảo vệ cơ cấu chấp hành
    {% if printer.toolhead.homed_axes != "xyz" %}
        M118 He thong chua Home. Dang tien hanh G28...
        G28
    {% endif %}

    # LINH KIỆN 1
    M118 *** LK 1: Feeder 1 -> PCB Pos 1 (Rot 45 deg) ***
    _PNP_CYCLE_CORE PICK_X=20 PICK_Y=20 PLACE_X=180 PLACE_Y=120 ANGLE=45
    G4 P1000 

    # LINH KIỆN 2
    M118 *** LK 2: Feeder 2 -> PCB Pos 2 (Rot 90 deg) ***
    _PNP_CYCLE_CORE PICK_X=40 PICK_Y=20 PLACE_X=220 PLACE_Y=150 ANGLE=90
    G4 P1000 

    # LINH KIỆN 3
    M118 *** LK 3: Feeder 3 -> PCB Pos 3 (Rot -30 deg) ***
    _PNP_CYCLE_CORE PICK_X=60 PICK_Y=20 PLACE_X=260 PLACE_Y=180 ANGLE=-30

    M118 ======== DA HOAN THANH LAP RAP BOARD MACH AC ! ========