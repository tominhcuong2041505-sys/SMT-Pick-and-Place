[include mainsail.cfg]
[include macro.pnp.cfg]
[include PnP_Demo.cfg]
[include test_stepper.cfg]
[respond]

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command
# serial: /dev/serial/by-id/usb-Klipper_lpc1769_03600019A99869AFB650425EC62000F5-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 100
max_z_accel: 1000

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

########################################
# TRỤC X - VẬT LÝ THẬT 
########################################
[stepper_x]
step_pin: P1.4
dir_pin: !P1.1
enable_pin: !P1.9
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.21
position_endstop: 0
position_min: 0
position_max: 430
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: P1.8
interpolate: False
run_current: 1.5
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC Y0 - VẬT LÝ THẬT
########################################
[stepper_y]
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.17
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.20
position_endstop: 0
position_min: 0
position_max: 285
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: P1.16
interpolate: False
run_current: 1
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC Y1 - MOTOR PHỤ
########################################
[stepper_y1]
step_pin: P2.3
dir_pin: !P2.2
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40

[tmc2209 stepper_y1]
uart_pin: P2.7
interpolate: False
run_current: 1
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC Z - VẬT LÝ THẬT (Cắm khe Z)
########################################
[stepper_z]
step_pin: P0.17
dir_pin: P0.15             # Thêm/bỏ dấu ! để chỉnh chiều lên xuống
enable_pin: !P0.19
microsteps: 16
rotation_distance: 40        # Chỉnh lại theo bước ren của vít me Z
endstop_pin: !P1.19
position_endstop: 0      # Thường PnP sẽ home Z ở trên cùng (max). Nếu home ở dưới, để 0
position_min: -55.000
position_max: 0
homing_speed: 20

[tmc2209 stepper_z]
uart_pin: P0.18              # Chân UART chuẩn của khe Z trên LPC1768/SKR 1.4
interpolate: False
run_current: 0.8
hold_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0

########################################
# TRỤC C - ĐIỀU KHIỂN ĐỘC LẬP (Cắm khe E1)
########################################
[manual_stepper c]
step_pin: P0.21
dir_pin: P0.20
enable_pin: !P0.10
microsteps: 16
rotation_distance: 360      # Cấu hình 1 đơn vị = 1 độ
velocity: 300              # Tốc độ xoay tối đa (độ/giây)
accel: 1000                 # Gia tốc xoay

[tmc2209 manual_stepper c]
uart_pin: P0.11
interpolate: False
run_current: 0.45
hold_current: 0.200
sense_resistor: 0.110
stealthchop_threshold: 0

[idle_timeout]
timeout: 1800

########################################
# VACCUM0.0 - Van điện từ
########################################
[output_pin valve1]
pin: P1.24
value: 0             # Mặc định tắt khi cấp điện
shutdown_value: 0    # Đảm bảo tắt ngay lập tức nếu Klipper báo lỗi

########################################
# LED Top
########################################
[output_pin led_top]
pin: P1.23
pwm: True            # Kích hoạt PWM để cấp dòng ổn định hoặc chỉnh độ sáng
value: 1.0             # 1.0 = Sáng 100% khi bật nguồn (đổi thành 0.0 nếu muốn mặc định tắt)
cycle_time: 0.0005   # Tần số 100Hz giúp LED không bị chớp nháy (flicker)
shutdown_value: 0.0  # Tự động tắt khi mạch báo lỗi

########################################
# LED Down
########################################
[output_pin led_down]
pin: P3.25
pwm: True            # Kích hoạt PWM để cấp dòng ổn định hoặc chỉnh độ sáng
value: 1.0          # 1.0 = Sáng 100% khi bật nguồn (đổi thành 0.0 nếu muốn mặc định tắt)
cycle_time: 0.0005   # Tần số 100Hz giúp LED không bị chớp nháy (flicker)
shutdown_value: 0.0  # Tự động tắt khi mạch báo lỗi

########################################
# Biến nhớ các trạng thái
########################################
[gcode_macro PNP_STATE]
description: Lưu trữ trạng thái hệ thống OpenPnP
variable_c_pos: 0.0
variable_vacuum_1: 0
gcode:

[gcode_button dp101_vacuum_sensor] 
pin: ^!P2.11
press_gcode:
    # Hút thành công -> Cập nhật biến thành 1
    SET_GCODE_VARIABLE MACRO=PNP_STATE VARIABLE=vacuum_1 VALUE=1
    M118 [SENSOR] Hút linh kiện thành công
release_gcode:
    # Rơi linh kiện / Không hút được -> Cập nhật biến thành 0
    SET_GCODE_VARIABLE MACRO=PNP_STATE VARIABLE=vacuum_1 VALUE=0
    M118 [SENSOR] Rơi linh kiện