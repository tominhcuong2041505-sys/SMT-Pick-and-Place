[homing_override]
axes: xyz
gcode:
  	G28 Z0
    G28 X0 Y0 C0
    ; G1 X10 Y10 Z-4 E0 F1000

[gcode_macro PNP_CONNECTED]
description: OpenPnP status
gcode:
    RESPOND MSG="OpenPnP Connected"

[gcode_macro M42]
description: Cầu nối lệnh M42 từ OpenPnP để điều khiển Actuator (ON/OFF)
gcode:
    {% set pin_num = params.P|default(-1)|int %}
    {% set pin_val = params.S|default(0)|float %}

    {% if pin_num == 1 %}
        {% if pin_val > 0.0 %}
            SET_PIN PIN=led_down VALUE=1
        {% else %}
            SET_PIN PIN=led_down VALUE=0.0
        {% endif %}
    
    {% elif pin_num == 2 %}
        {% if pin_val > 0.0 %}
            SET_PIN PIN=led_top VALUE=1
        {% else %}
            SET_PIN PIN=led_top VALUE=0.0
        {% endif %}

	{% elif pin_num == 5 %}
        {% if pin_val > 0.0 %}
            SET_PIN PIN=valve1 VALUE=0.0
        {% else %}
            SET_PIN PIN=valve1 VALUE=1.0
        {% endif %}
    {% endif %}

    RESPOND MSG="ok"

[gcode_macro M43]
description: OpenPnP đọc trạng thái cảm biến (M43 P1 cho Valve 1)
gcode:
    {% set pin_num = params.P|default(-1)|int %}
    
    {% if pin_num == 1 %}
        {% set vac_state = printer["gcode_macro PNP_STATE"].vacuum_1 %}
        RESPOND MSG="ok V:{vac_state}"
    {% else %}
        RESPOND MSG="ok V:0"
    {% endif %}

[gcode_macro G1]
rename_existing: G1.1
gcode:
    {% set c_axis = params.get('C') %}
    {% set feedrate = (params.get('F')|float / 60.0) if 'F' in params else printer.gcode_move.speed %}
    
    {% if c_axis is not none %}
        MANUAL_STEPPER STEPPER=c MOVE={c_axis|float} SPEED={feedrate} SYNC=0
        SET_GCODE_VARIABLE MACRO=PNP_STATE VARIABLE=c_pos VALUE={c_axis|float}
    {% endif %}
    
    {% set clean_params = [] %}
    {% for k in params %}
        {% if k != 'C' %}
            {% set _ = clean_params.append(k ~ params[k]) %}
        {% endif %}
    {% endfor %}
    
    {% if clean_params|length > 0 %}
        G1.1 {clean_params|join(" ")}
    {% endif %}

[gcode_macro G0]
rename_existing: G0.1
gcode:
    {% set c_axis = params.get('C') %}
    {% set feedrate = (params.get('F')|float / 60.0) if 'F' in params else printer.gcode_move.speed %}
    
    {% if c_axis is not none %}
        MANUAL_STEPPER STEPPER=c MOVE={c_axis|float} SPEED={feedrate} SYNC=0
        SET_GCODE_VARIABLE MACRO=PNP_STATE VARIABLE=c_pos VALUE={c_axis|float}
    {% endif %}
    
    {% set clean_params = [] %}
    {% for k in params %}
        {% if k != 'C' %}
            {% set _ = clean_params.append(k ~ params[k]) %}
        {% endif %}
    {% endfor %}
    
    {% if clean_params|length > 0 %}
        G0.1 {clean_params|join(" ")}
    {% endif %}

[gcode_macro M114]
rename_existing: M114.1
gcode:
    M400
    {% set pos = printer.toolhead.position %}
    {% set current_c = printer["gcode_macro PNP_STATE"].c_pos %}
    RESPOND TYPE=command MSG="X:{'%.3f' % pos.x} Y:{'%.3f' % pos.y} Z:{'%.3f' % pos.z} C:{'%.3f' % current_c}"